name: Scrape Buford Dam Schedule

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours
  workflow_dispatch:         # allow manual runs from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install requests beautifulsoup4 lxml

      - run: python scraper.py --out schedule.json

      - name: Commit updated schedule
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git diff --staged --quiet || git commit -m "chore: update schedule $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
